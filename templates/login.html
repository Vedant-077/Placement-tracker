{% extends "base.html" %}

{% block title %}Login | Placement Tracker{% endblock %}

{% block body %}

<style>
    .auth-container {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .auth-card {
        width: 100%;
        max-width: 430px;
        background: #ffffff;
        padding: 36px;
        border-radius: 18px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
    }

    .auth-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef2ff;
        border-radius: 16px;
        color: #4f46e5;
        font-size: 28px;
    }

    .auth-card h1 {
        text-align: center;
        color: #172554;
        font-size: 28px;
        margin: 0 0 10px;
    }

    .auth-subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 28px;
        line-height: 1.6;
    }

    .auth-field {
        margin-bottom: 20px;
    }

    .auth-field label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #334155;
    }

    .auth-field input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
        background: #ffffff;
        color: #1e293b;
    }

    .auth-field input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .auth-button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 9px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 5px;
    }

    .auth-button:hover {
        background: #4338ca;
    }

    .auth-switch {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: #64748b;
    }

    .auth-switch a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-switch a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .auth-card {
            padding: 25px 20px;
        }
    }
</style>

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-icon">✦</div>

        <h1>Welcome Back!</h1>

        <p class="auth-subtitle">
            Sign in to manage your placement applications
            and track your career progress.
        </p>

        <form method="post" action="{{ url_for('login') }}">

            <div class="auth-field">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="auth-field">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="auth-button">
                Sign In →
            </button>

        </form>

        <div class="auth-switch">
            New to Placement Tracker?
            <a href="{{ url_for('register') }}">Create an account</a>
        </div>

    </div>
</div>

{% endblock %}
